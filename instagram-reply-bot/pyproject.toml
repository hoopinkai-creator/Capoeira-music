[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-reply-bot"
version = "0.1.0"
description = "Reply to comments on an Instagram reel/post via the official Graph API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

# The core uses only the standard library + PyYAML. AI-composed replies are
# optional and pull in the Anthropic SDK.
[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
ig-reply-bot = "instagram_reply_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instagram_reply_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
