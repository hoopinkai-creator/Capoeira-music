[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capoeira-music"
version = "0.1.0"
description = "Turn recorded Capoeira music classes into berimbau notation and a living course document."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

# Optional feature groups. The pure-Python core (notation, course, render-svg)
# works with no extras installed. Audio / speech / AI features pull heavier deps.
[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]
speech = [
    "faster-whisper>=1.0",
]
ai = [
    "anthropic>=0.40",
]
render = [
    "svgwrite>=1.4",
    "cairosvg>=2.7",
]
all = [
    "capoeira-music[audio,speech,ai,render]",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
capoeira = "capoeira.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
